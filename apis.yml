name: Headgum
description: >-
  Headgum is an American comedy podcast network founded in 2015 by Marty Michael,
  Amir Blumenfeld, and Jake Hurwitz, with studios in Los Angeles and New York. It
  produces and distributes premium comedy and entertainment podcasts including
  Doughboys, Not Another D&D Podcast, Dead Eyes, Hey Riddle Riddle, and Why Won't
  You Date Me?, and operates Gumball, a host-read podcast and YouTube advertising
  marketplace that lets brands buy ads directly from creators. Headgum is a
  portfolio company of Union Square Ventures. This profile is maintained in the
  API Evangelist network; as of this pass Headgum publishes no public developer
  API, SDK, or OpenAPI surface.
